; Filigrane — réglages PHP alignés sur l'hébergement o2switch
; (volontairement identiques à la prod pour que les limites se révèlent dès le dev)

memory_limit = 512M
upload_max_filesize = 512M
post_max_size = 512M
max_file_uploads = 20
max_execution_time = 300
max_input_time = 300

date.timezone = Europe/Paris

; Les photos sont lourdes : on autorise ImageMagick à travailler confortablement.
imagick.locale_fix = 1

; Dev : on veut voir les erreurs.
display_errors = On
error_reporting = E_ALL

opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
