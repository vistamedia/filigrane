<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Filigrane — icône de l'application.
       Dessinée plein bord, sans coins arrondis : iOS, Android et les
       navigateurs appliquent leur propre masque. -->
  <rect width="64" height="64" fill="#F4EEE2"/>
  <circle cx="37.6" cy="32" r="18.5" fill="#8E462F"/>
  <circle cx="45.1" cy="32" r="17" fill="#F4EEE2"/>
  <!-- La trame du papier vergé, vue à contre-jour : vergeures serrées,
       pontuseaux espacés. Elle passe par-dessus le motif, et c'est ce qui
       distingue un filigrane — pris dans l'épaisseur de la feuille — d'un
       dessin posé à sa surface. -->
  <g fill="none" stroke="#1C1A17">
    <g stroke-width="0.45" opacity="0.045">
      <line x1="0" y1="1.4" x2="64" y2="1.4"/>
      <line x1="0" y1="3.2" x2="64" y2="3.2"/>
      <line x1="0" y1="5.0" x2="64" y2="5.0"/>
      <line x1="0" y1="6.8" x2="64" y2="6.8"/>
      <line x1="0" y1="8.6" x2="64" y2="8.6"/>
      <line x1="0" y1="10.4" x2="64" y2="10.4"/>
      <line x1="0" y1="12.2" x2="64" y2="12.2"/>
      <line x1="0" y1="14.0" x2="64" y2="14.0"/>
      <line x1="0" y1="15.8" x2="64" y2="15.8"/>
      <line x1="0" y1="17.6" x2="64" y2="17.6"/>
      <line x1="0" y1="19.4" x2="64" y2="19.4"/>
      <line x1="0" y1="21.2" x2="64" y2="21.2"/>
      <line x1="0" y1="23.0" x2="64" y2="23.0"/>
      <line x1="0" y1="24.8" x2="64" y2="24.8"/>
      <line x1="0" y1="26.6" x2="64" y2="26.6"/>
      <line x1="0" y1="28.4" x2="64" y2="28.4"/>
      <line x1="0" y1="30.2" x2="64" y2="30.2"/>
      <line x1="0" y1="32.0" x2="64" y2="32.0"/>
      <line x1="0" y1="33.8" x2="64" y2="33.8"/>
      <line x1="0" y1="35.6" x2="64" y2="35.6"/>
      <line x1="0" y1="37.4" x2="64" y2="37.4"/>
      <line x1="0" y1="39.2" x2="64" y2="39.2"/>
      <line x1="0" y1="41.0" x2="64" y2="41.0"/>
      <line x1="0" y1="42.8" x2="64" y2="42.8"/>
      <line x1="0" y1="44.6" x2="64" y2="44.6"/>
      <line x1="0" y1="46.4" x2="64" y2="46.4"/>
      <line x1="0" y1="48.2" x2="64" y2="48.2"/>
      <line x1="0" y1="50.0" x2="64" y2="50.0"/>
      <line x1="0" y1="51.8" x2="64" y2="51.8"/>
      <line x1="0" y1="53.6" x2="64" y2="53.6"/>
      <line x1="0" y1="55.4" x2="64" y2="55.4"/>
      <line x1="0" y1="57.2" x2="64" y2="57.2"/>
      <line x1="0" y1="59.0" x2="64" y2="59.0"/>
      <line x1="0" y1="60.8" x2="64" y2="60.8"/>
